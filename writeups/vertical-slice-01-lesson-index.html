<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Best Speech Analysis — Vertical Slice 01</title>
<style>
:root { font-family: system-ui,-apple-system,Segoe UI,sans-serif; color:#202938; background:#f5f3ee; }
body { margin:0; } header { background:#17212b; color:white; padding:28px max(22px,calc((100vw - 1100px)/2)); }
main { max-width:1100px; margin:24px auto; padding:0 22px 60px; }
.notice { background:#fff7d6; border:1px solid #d8bd61; padding:14px; border-radius:8px; }
.controls { margin:16px 0; } input { font:inherit; padding:9px; width:min(100%,480px); border:1px solid #aaa; border-radius:6px; }
.card { background:white; border:1px solid #d7d0c5; border-radius:10px; padding:18px; margin:14px 0; }
.tag { display:inline-block; background:#e2edf5; border-radius:99px; padding:3px 8px; margin:2px; font-size:.82rem; }
.meta { color:#5b6570; font-size:.9rem; } a { color:#075985; }
</style></head><body><header><h1>Vertical Slice 01</h1><p>Communication jobs, evidence packets, and draft practice lessons.</p></header>
<main><div class="notice"><b>Evidence boundary:</b> These are provisional practice hypotheses. They have not been independently adjudicated or learner-validated and do not prove trust, memory, persuasion, or action effects.</div>
<div class="controls"><label>Filter lessons <input id="search" placeholder="communication job or pattern"></label></div><section id="lessons"></section></main>
<script id="lesson-data" type="application/json">[{"pattern_id": "provisional-contrast_or_disagreement", "communication_job": "disagree safely or show a change in reasoning without confusing textual contrast with interpersonal disagreement.", "practice_hypothesis": "When correcting or distinguishing ideas, state the contrast directly (for example, expected outcome versus observed outcome) and then supply the replacement claim or evidence.", "evidence_level": "provisional_practice_hypothesis", "packet": "research/vertical-slice-01-contrast-or-disagreement.json", "lesson": "writeups/vertical-slice-01-lesson-contrast.md", "practice_flows": "research/vertical-slice-01-practice-flows.json", "learner_check": "writeups/vertical-slice-01-learner-check.html", "lesson_status": "draft_not_validated", "packet_status": "evidence_packet_partial_not_validated", "independence_status": "metadata_audited_speaker_unverified", "review_status": "pending_external_reviewer", "learner_status": "protocol_drafted_not_run", "representative_example_count": 5, "counterexample_count": 0, "source_limit": "Transcript and existing reviewed annotation records are evidence of textual segments and recorded interpretation. They do not establish successful disagreement, listener effect, causal mechanism or speaker/event independence."}, {"pattern_id": "provisional-example", "communication_job": "make an abstract or general claim concrete without treating an illustration as proof.", "practice_hypothesis": "After an abstract claim, announce or signal a specific case, statistic, named example, or imagined scene, and connect it back to the claim.", "evidence_level": "provisional_practice_hypothesis", "packet": "research/vertical-slice-01-example.json", "lesson": "writeups/vertical-slice-01-lesson-example.md", "practice_flows": "research/vertical-slice-01-practice-flows.json", "learner_check": "writeups/vertical-slice-01-learner-check.html", "lesson_status": "draft_not_validated", "packet_status": "evidence_packet_partial_not_validated", "independence_status": "metadata_audited_speaker_unverified", "review_status": "not_started", "learner_status": "protocol_drafted_not_run", "representative_example_count": 5, "counterexample_count": 6, "source_limit": "Reviewed transcript segments and coarse aligned audio proxies are evidence of textual structure and measurement, not proof of factuality, causality, listener comprehension or general effectiveness."}, {"pattern_id": "provisional-story_or_personal_experience", "communication_job": "use bounded personal detail to make an idea concrete without treating autobiography as universal proof.", "practice_hypothesis": "A short first-person event, setting, action, or quoted line can make an abstract point concrete; mark the transition back to the broader point.", "evidence_level": "provisional_practice_hypothesis", "packet": "research/vertical-slice-01-story.json", "lesson": "writeups/vertical-slice-01-lesson-story.md", "practice_flows": "research/vertical-slice-01-practice-flows.json", "learner_check": "writeups/vertical-slice-01-learner-check.html", "lesson_status": "draft_not_validated", "packet_status": "evidence_packet_partial_not_validated", "independence_status": "metadata_audited_speaker_unverified", "review_status": "not_started", "learner_status": "protocol_drafted_not_run", "representative_example_count": 5, "counterexample_count": 3, "source_limit": "Reviewed transcript segments and coarse aligned audio proxies show textual narrative features; they do not verify biography, motive, factuality, audience response or causal effect."}, {"pattern_id": "provisional-uncertainty_or_qualification", "communication_job": "state uncertainty, possibility or recommendation limits precisely without hiding the main point behind vague hedging.", "practice_hypothesis": "Use explicit qualifiers such as 'I think', 'might', or 'probably' when a claim is a view, prediction, or interpretation rather than an established fact.", "evidence_level": "provisional_practice_hypothesis", "packet": "research/vertical-slice-01-uncertainty.json", "lesson": "writeups/vertical-slice-01-lesson-uncertainty.md", "practice_flows": "research/vertical-slice-01-practice-flows.json", "learner_check": "writeups/vertical-slice-01-learner-check.html", "lesson_status": "draft_not_validated", "packet_status": "evidence_packet_partial_not_validated", "independence_status": "metadata_audited_speaker_unverified", "review_status": "not_started", "learner_status": "protocol_drafted_not_run", "representative_example_count": 5, "counterexample_count": 4, "source_limit": "Reviewed transcript segments and coarse aligned audio proxies show qualification markers and context; they do not establish factuality, speaker certainty, sincerity, listener calibration or outcome effects."}, {"pattern_id": "provisional-conclusion_or_summary", "communication_job": "close or compress an explanation so the listener can state the takeaway without mistaking a marker for proof.", "practice_hypothesis": "Use a clear summary or conclusion marker when compressing a preceding explanation, story, or comparison into the point the audience should retain.", "evidence_level": "provisional_practice_hypothesis", "packet": "research/vertical-slice-01-conclusion.json", "lesson": "writeups/vertical-slice-01-lesson-conclusion.md", "practice_flows": "research/vertical-slice-01-practice-flows.json", "learner_check": "writeups/vertical-slice-01-learner-check.html", "lesson_status": "draft_not_validated", "packet_status": "evidence_packet_partial_not_validated", "independence_status": "metadata_audited_speaker_unverified", "review_status": "not_started", "learner_status": "protocol_drafted_not_run", "representative_example_count": 5, "counterexample_count": 5, "source_limit": "Reviewed transcript segments and coarse aligned audio proxies show summary markers and context; they do not establish that listeners understood, remembered or acted on the takeaway."}]</script><script>
const rows=JSON.parse(document.getElementById('lesson-data').textContent), out=document.getElementById('lessons'), input=document.getElementById('search');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const q=input.value.toLowerCase(); const xs=rows.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q)); out.innerHTML=xs.map(x=>`<article class="card"><div class="meta">${esc(x.pattern_id)} · ${esc(x.evidence_level)}</div><h2>${esc(x.communication_job)}</h2><p>${esc(x.practice_hypothesis)}</p><p><span class="tag">packet: ${esc(x.packet_status)}</span><span class="tag">review: ${esc(x.review_status)}</span><span class="tag">learner: ${esc(x.learner_status)}</span></p><p>${x.representative_example_count} examples · ${x.counterexample_count} controls</p><p><a href="../${esc(x.lesson)}">Open draft lesson</a> · <a href="../${esc(x.packet)}">Inspect evidence packet</a> · <a href="../${esc(x.practice_flows)}">Practice flow</a> · <a href="../${esc(x.learner_check)}">Learner check</a></p></article>`).join('')||'<p>No matching lesson.</p>';}
input.addEventListener('input',render); render();
</script></body></html>
