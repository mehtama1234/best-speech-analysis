<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Communication-job listener record</title><style>body{font:16px/1.5 system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17202a}fieldset{border:1px solid #9aa7b2;border-radius:.5rem;margin:1.5rem 0;padding:1rem}label{display:block;margin:.7rem 0}textarea{display:block;width:100%;box-sizing:border-box;margin-top:.3rem}input,select{padding:.35rem}button{padding:.6rem 1rem;margin:.5rem .5rem .5rem 0}.notice{background:#fff6d6;border-left:4px solid #c88a00;padding:.8rem}</style></head><body><h1>Communication-job listener outcome record</h1><div class='notice'><strong>Not an effectiveness claim.</strong> Use only after matched stimuli are authored, pretested and locked. This form measures local comprehension/recall tasks, not trust, liking, persuasion or behavior.</div><form id='record'><fieldset><legend>Session</legend><label>Participant code<input required name='participant_code'></label><label>Date<input required type='date' name='date'></label><label>Protocol version<input required name='protocol_version' value='communication-job-listener-outcome-v1'></label><label>Modality<input required name='modality'></label><label>Stimulus ID<input required name='stimulus_id'></label><label>Condition<select required name='condition'><option value=''>Choose</option><option>control</option><option>pattern_informed</option><option>unknown_or_blinded</option></select></label><label>Blind scorer code<input required name='scorer_id_or_blind_code'></label><label><input required type='checkbox' name='consent'> Consent recorded for this session.</label></fieldset><fieldset><legend>Listener responses and blind scores</legend><label>main_point_recall<textarea required name='task_main_point_recall' rows='3' placeholder='State the speaker&#x27;s main point in your own words without seeing the script.'></textarea><span>Blind score: <select required name='score_main_point_recall'><option value=''>Choose</option><option value='0'>0 — not recalled, incorrect or not scorable</option><option value='1'>1 — partial or materially incomplete</option><option value='2'>2 — accurate and sufficiently complete</option><option value='null'>Not feasible / inaccessible</option></select></span></label><label>evidence_or_example_identification<textarea required name='task_evidence_or_example_identification' rows='3' placeholder='Name the example, reason or evidence the speaker used, if any.'></textarea><span>Blind score: <select required name='score_evidence_or_example_identification'><option value=''>Choose</option><option value='0'>0 — not recalled, incorrect or not scorable</option><option value='1'>1 — partial or materially incomplete</option><option value='2'>2 — accurate and sufficiently complete</option><option value='null'>Not feasible / inaccessible</option></select></span></label><label>limit_or_condition_identification<textarea required name='task_limit_or_condition_identification' rows='3' placeholder='State one limit, uncertainty or condition included by the speaker, or say that none was clear.'></textarea><span>Blind score: <select required name='score_limit_or_condition_identification'><option value=''>Choose</option><option value='0'>0 — not recalled, incorrect or not scorable</option><option value='1'>1 — partial or materially incomplete</option><option value='2'>2 — accurate and sufficiently complete</option><option value='null'>Not feasible / inaccessible</option></select></span></label><label>requested_action_or_role<textarea required name='task_requested_action_or_role' rows='3' placeholder='What action or role, if any, did the speaker invite? Include owner or condition if stated.'></textarea><span>Blind score: <select required name='score_requested_action_or_role'><option value=''>Choose</option><option value='0'>0 — not recalled, incorrect or not scorable</option><option value='1'>1 — partial or materially incomplete</option><option value='2'>2 — accurate and sufficiently complete</option><option value='null'>Not feasible / inaccessible</option></select></span></label><label>confusion_and_load<textarea required name='task_confusion_and_load' rows='3' placeholder='Report what was confusing, rushed, emotionally difficult or easy to follow; agreement is not required.'></textarea><span>Blind score: <select required name='score_confusion_and_load'><option value=''>Choose</option><option value='0'>0 — not recalled, incorrect or not scorable</option><option value='1'>1 — partial or materially incomplete</option><option value='2'>2 — accurate and sufficiently complete</option><option value='null'>Not feasible / inaccessible</option></select></span></label><label>delayed_recall<textarea required name='task_delayed_recall' rows='3' placeholder='After a defined delay, restate the main point and one supporting detail.'></textarea><span>Blind score: <select required name='score_delayed_recall'><option value=''>Choose</option><option value='0'>0 — not recalled, incorrect or not scorable</option><option value='1'>1 — partial or materially incomplete</option><option value='2'>2 — accurate and sufficiently complete</option><option value='null'>Not feasible / inaccessible</option></select></span></label></fieldset><fieldset><legend>Optional notes</legend><label>Accessibility issue or missing task reason<select required name='accessibility_issue'><option value=''>Choose</option><option>no</option><option>yes</option></select></label><label>Prior topic familiarity<textarea name='prior_topic_familiarity' rows='2'></textarea></label><label>Agreement or confidence<textarea name='agreement_or_confidence' rows='2'></textarea></label><label>Accessibility accommodation or missing reason<textarea name='accessibility_or_missing_reason' rows='2'></textarea></label></fieldset><button type='button' id='download'>Download JSON record</button><button type='reset'>Clear</button></form><script>document.querySelector('#download').onclick=()=>{const f=document.querySelector('#record');if(!f.reportValidity())return;const r={schema_version:'1.0',protocol_id:'communication-job-listener-outcome-protocol',record_type:'communication_job_listener_outcome_observation',claim_boundary:'Local listener comprehension/recall observation only; not general effectiveness evidence.',responses:{}};for(const e of f.elements)if(e.name){let v=e.type==='checkbox'?e.checked:e.value;if(e.name.startsWith('score_')&&v==='null')v=null;else if(e.name.startsWith('score_')&&v!=='')v=Number(v);r.responses[e.name]=v}const b=new Blob([JSON.stringify(r,null,2)+'\n'],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='communication-job-listener-record-'+r.responses.participant_code+'.json';a.click();URL.revokeObjectURL(u)};</script></body></html>
